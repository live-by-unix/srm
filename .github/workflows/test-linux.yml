name: Test Linux

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xdg-utils

    - name: Run shell tests
      run: |
        cd tests/shell
        ./test-basics.sh

    - name: Test srm
      run: |
        ./srm --version 2>/dev/null || ./srmi --version
